[pytest]
testpaths = tests
# Slow tests (e.g. the CNN training smoke test, ~2-5 min on CPU) run with: pytest -m slow
addopts = -q -m "not slow" --basetemp=outputs/.pytest_tmp
markers =
    slow: takes minutes; excluded from the default run
filterwarnings =
    # Keras 3.15 + NumPy 2.5 compatibility notice; harmless
    ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning
